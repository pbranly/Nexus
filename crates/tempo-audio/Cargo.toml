[package]
publish = false
name = "tempo-audio"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Nexus real-radio transport: sound-card audio (cpal) + PTT/CAT via rigctld, on the FT1 slot clock"

[lints]
workspace = true
[features]
default = []
device = ["dep:cpal", "dep:tempo-net", "dep:tempo-sstv", "dep:alsa"]
serial = ["dep:serialport"]
ai-cw = ["dep:deepcw"]
yaesu-wf = []

[[example]]
name = "audio_probe"
required-features = ["device"]

[[example]]
name = "yaesu_wf_probe"
required-features = ["yaesu-wf"]

[[example]]
name = "yaesu_wf_dump"
required-features = ["yaesu-wf"]

[dependencies]
tempo-app = { path = "../tempo-app" }
tempo-core = { path = "../tempo-core" }
hound = "3.5"
png = "0.17"
cpal = { version = "0.18", optional = true }
serialport = { version = "4", optional = true }
deepcw = { path = "../deepcw", optional = true }
tempo-net = { path = "../tempo-net", optional = true }
tempo-sstv = { path = "../tempo-sstv", optional = true }
serde_json = "1"
tungstenite = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "0.11", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-sys = "0.2"
core-foundation-sys = "0.8"
io-kit-sys = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[dev-dependencies]
propagation = { path = "../propagation" }
